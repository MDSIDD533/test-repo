name: Publish batch summary

# One-shot: reads a completed batch run, summarizes its artifacts, and posts the
# result as a pull-request comment so it is readable without blob storage.
on:
  push:
    paths:
      - ".github/publish-request.json"

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    name: Summarize and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Read the request
        id: read
        run: |
          file=".github/publish-request.json"
          if [ ! -f "$file" ]; then
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_id=$(jq -r '.run_id // ""' "$file")" >> "$GITHUB_OUTPUT"
          echo "trials=$(jq -r '.trials // 0' "$file")" >> "$GITHUB_OUTPUT"
      - name: Download that run's artifacts
        if: steps.read.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.read.outputs.run_id }}
          pattern: forecast-trials-shard-*
          path: forecast-batch-reports
          merge-multiple: true
      - name: Summarize and evaluate
        if: steps.read.outputs.run_id != ''
        run: |
          set +e
          python scripts/summarize_trial_batch.py forecast-batch-reports \
            --output forecast-batch-summary.json > summary.txt 2>&1
          summarize_code=$?
          python scripts/evaluate_forecast_models.py forecast-batch-reports \
            --output forecast-model-evaluation.json > evaluation.txt 2>&1
          evaluate_code=$?
          set -e
          cat summary.txt
          echo "--- evaluation ---"
          tail -n 30 evaluation.txt
          {
            echo "## Live batch ${{ steps.read.outputs.run_id }}"
            echo ""
            echo '```'
            cat summary.txt
            echo '```'
            echo ""
            echo "<details><summary>Full summary JSON</summary>"
            echo ""
            echo '```json'
            cat forecast-batch-summary.json
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>Chronological holdout evaluation</summary>"
            echo ""
            echo '```json'
            cat forecast-model-evaluation.json
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "summarize exit=$summarize_code · evaluate exit=$evaluate_code"
          } > comment.md
      - name: Post the comment
        if: steps.read.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No open pull request for $GITHUB_REF_NAME"; exit 0; fi
          gh pr comment "$pr" --body-file comment.md
      - name: Upload the summary
        if: steps.read.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: published-batch-summary
          path: |
            forecast-batch-summary.json
            forecast-model-evaluation.json
          if-no-files-found: warn
