name: Cancel accidental forecast batch

# Temporary safety workflow: cancels the unintended 100-trial run triggered by
# a script path change. It is removed immediately after the run is cancelled.
on:
  push:
    paths:
      - ".github/workflows/cancel-accidental-run.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the accidental live batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting cancel for run 39722964529"
          gh api -X POST "repos/${{ github.repository }}/actions/runs/39722964529/cancel" --include || true
          echo "Run state after request:"
          gh api "repos/${{ github.repository }}/actions/runs/39722964529" --jq '{status,conclusion}' || true
