name: Export candle fixture (recorded data)

# CI runners can reach an exchange; the development sandbox cannot. This job
# records what the real provider layer returns and commits it, so replay mode
# shows genuine market history instead of invented candles.
on:
  push:
    paths:
      - ".github/export-request.json"

permissions:
  contents: write

jobs:
  export:
    name: Record and commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Record real candles
        run: |
          if [ ! -f .github/export-request.json ]; then
            echo "No export request in this commit."; exit 0
          fi
          python scripts/export_candles_fixture.py --output fixtures/candles.json
      - name: Commit the recording
        run: |
          if [ ! -f fixtures/candles.json ]; then
            echo "Nothing was recorded; refusing to commit an empty fixture."; exit 1
          fi
          git config user.name "fixture-export"
          git config user.email "fixture-export@users.noreply.github.com"
          git add fixtures/candles.json
          if git diff --cached --quiet; then echo "Fixture unchanged."; exit 0; fi
          git commit -m "Record real provider candles for replay mode [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
