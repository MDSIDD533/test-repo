name: Capture screenshots

# Produces real screenshots of the running app with a real browser and commits
# them, so the repository shows what was actually built instead of describing it.
# Runs in replay mode so it needs no exchange access and cannot misrepresent a
# recording as live data.
on:
  push:
    paths:
      - ".github/screenshot-request.json"

permissions:
  contents: write

jobs:
  capture:
    name: Capture and commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Skip when there is no request
        id: gate
        run: |
          if [ -f .github/screenshot-request.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No screenshot request in this commit."
          fi
      - name: Start the app in replay mode
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p evidence
          MARKET_DATA_MODE=replay nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8002 > evidence/screenshot-uvicorn.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8002/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8002/api/health
      - name: Capture
        if: steps.gate.outputs.run == 'true'
        run: |
          node scripts/capture_screenshots.js 2>&1 | tee evidence/capture.log
      - name: Commit the screenshots
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f docs/screenshots/01-dashboard.png ]; then
            echo "No dashboard screenshot was produced; refusing to commit."; exit 1
          fi
          git config user.name "screenshot-bot"
          git config user.email "screenshot-bot@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Add screenshots of the running app [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
      - name: Fail loudly on a broken page
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open('docs/screenshots/capture.json'))
          errors = data.get('page_errors') or []
          print('screenshots:', [s['file'] for s in data['screenshots']])
          if errors:
              print('page errors:', errors)
              sys.exit(1)
          PY
